<!-- @dsCard group="Brand" viewport="700x140" subtitle="Material Symbols Rounded (FILL 1) — canonical activity icons" name="Iconography" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
.wrap{padding:16px 20px;display:flex;gap:24px}
.chip{width:52px;height:52px;border-radius:var(--radius-full);display:grid;place-items:center}
.lbl{font:var(--type-caption);font-family:var(--font-mono);color:var(--on-surface-faint);text-align:center;margin-top:6px}
</style></head><body>
<div class="wrap">
  <div><div class="chip" style="background:var(--accent-diet-container);color:var(--accent-diet)"><span class="material-symbols-rounded" style="font-size:26px">restaurant</span></div><div class="lbl">diet</div></div>
  <div><div class="chip" style="background:var(--accent-workout-container);color:var(--accent-workout)"><span class="material-symbols-rounded" style="font-size:26px">fitness_center</span></div><div class="lbl">workout</div></div>
  <div><div class="chip" style="background:var(--accent-study-container);color:var(--accent-study)"><span class="material-symbols-rounded" style="font-size:26px">school</span></div><div class="lbl">study</div></div>
  <div><div class="chip" style="background:var(--accent-sleep-container);color:var(--accent-sleep)"><span class="material-symbols-rounded" style="font-size:26px">bedtime</span></div><div class="lbl">sleep</div></div>
  <div style="align-self:center;margin-left:16px">
    <div style="font:var(--type-title);color:var(--on-surface)">Daily Tracker</div>
    <div style="font:var(--type-caption);color:var(--on-surface-faint)">no logo — wordmark in plain type</div>
  </div>
</div>
</body></html>
