<!-- @dsCard group="Colors" viewport="700x150" subtitle="Neutral dark base — tonal elevation" name="Surfaces & neutrals" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:16px}
.sw{height:56px;border-radius:12px;border:1px solid var(--outline-variant)}
.lbl{font:var(--type-caption);color:var(--text-secondary);padding:6px 2px 0;font-family:var(--font-mono)}
</style></head><body>
<div class="row">
  <div><div class="sw" style="background:var(--surface-0)"></div><div class="lbl">--surface-0</div></div>
  <div><div class="sw" style="background:var(--surface-1)"></div><div class="lbl">--surface-1</div></div>
  <div><div class="sw" style="background:var(--surface-2)"></div><div class="lbl">--surface-2</div></div>
  <div><div class="sw" style="background:var(--surface-3)"></div><div class="lbl">--surface-3</div></div>
  <div><div class="sw" style="background:var(--on-surface)"></div><div class="lbl">--on-surface</div></div>
  <div><div class="sw" style="background:var(--outline)"></div><div class="lbl">--outline</div></div>
</div>
</body></html>
