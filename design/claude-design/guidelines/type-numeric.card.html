<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
.wrap{padding:16px 20px;display:flex;align-items:baseline;gap:32px}
.n{font:var(--type-caption);font-family:var(--font-mono);color:var(--on-surface-faint);display:block;margin-top:4px}
</style></head><body>
<div class="wrap">
  <div><span style="font:var(--type-numeric-lg);color:var(--accent-diet)">150</span><span style="font:var(--type-body);color:var(--text-secondary)"> g</span><span class="n">--type-numeric-lg 22/28</span></div>
  <div><span style="font:var(--type-numeric);color:var(--on-surface)">264 kcal</span><span class="n">--type-numeric 14/20</span></div>
  <div><span style="font:var(--type-numeric);color:var(--text-secondary)">7h 20m</span><span class="n">secondary value</span></div>
  <div><span style="font:var(--type-numeric);color:var(--text-secondary)">4 × 8 · 60 kg</span><span class="n">workout set</span></div>
</div>
</body></html>
