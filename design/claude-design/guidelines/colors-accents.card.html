<!-- @dsCard group="Colors" viewport="700x150" subtitle="One accent per activity — matched chroma & lightness" name="Activity accents" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px}
.sw{border-radius:12px;overflow:hidden}
.top{height:56px}.bot{height:28px}
.lbl{font:var(--type-caption);color:var(--text-secondary);padding:6px 2px 0;font-family:var(--font-mono)}
</style></head><body>
<div class="row">
  <div><div class="sw"><div class="top" style="background:var(--accent-diet)"></div><div class="bot" style="background:var(--accent-diet-container)"></div></div><div class="lbl">--accent-diet</div></div>
  <div><div class="sw"><div class="top" style="background:var(--accent-workout)"></div><div class="bot" style="background:var(--accent-workout-container)"></div></div><div class="lbl">--accent-workout</div></div>
  <div><div class="sw"><div class="top" style="background:var(--accent-study)"></div><div class="bot" style="background:var(--accent-study-container)"></div></div><div class="lbl">--accent-study</div></div>
  <div><div class="sw"><div class="top" style="background:var(--accent-sleep)"></div><div class="bot" style="background:var(--accent-sleep-container)"></div></div><div class="lbl">--accent-sleep</div></div>
</div>
</body></html>
