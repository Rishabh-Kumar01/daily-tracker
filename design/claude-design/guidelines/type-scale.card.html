<!-- @dsCard group="Type" viewport="700x290" subtitle="Roboto UI scale — M3 mobile subset" name="Type scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
.wrap{padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.r{display:flex;align-items:baseline;gap:16px}
.t{color:var(--on-surface)}
.n{font:var(--type-caption);font-family:var(--font-mono);color:var(--on-surface-faint);margin-left:auto;flex:none}
</style></head><body>
<div class="wrap">
  <div class="r"><span class="t" style="font:var(--type-headline)">Today</span><span class="n">--type-headline 24/32</span></div>
  <div class="r"><span class="t" style="font:var(--type-title-lg)">Total 0% Greek Yogurt</span><span class="n">--type-title-lg 20/28</span></div>
  <div class="r"><span class="t" style="font:var(--type-title)">Workout</span><span class="n">--type-title 16/24</span></div>
  <div class="r"><span class="t" style="font:var(--type-body-lg)">Chicken breast</span><span class="n">--type-body-lg 16/24</span></div>
  <div class="r"><span class="t" style="font:var(--type-body);color:var(--text-secondary)">1,840 kcal · 132g protein</span><span class="n">--type-body 14/20</span></div>
  <div class="r"><span class="t" style="font:var(--type-label);letter-spacing:var(--tracking-label)">Add to log</span><span class="n">--type-label 12/16</span></div>
  <div class="r"><span class="t" style="font:var(--type-caption);color:var(--on-surface-faint)">per 100g · 54 kcal · 10.3P · 3.0C · 0.2F</span><span class="n">--type-caption 11/16</span></div>
</div>
</body></html>
