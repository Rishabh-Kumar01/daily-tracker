<!-- @dsCard group="Spacing" viewport="700x170" subtitle="4px grid, shape scale, touch targets" name="Spacing & shape" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
.wrap{padding:16px 20px;display:flex;gap:28px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px}
.lbl{font:var(--type-caption);font-family:var(--font-mono);color:var(--on-surface-faint)}
.bar{background:var(--accent-study-container);border-left:2px solid var(--accent-study);height:14px}
.shape{background:var(--surface-3);border:1px solid var(--outline)}
.shrow{display:flex;gap:16px;align-items:flex-end}
</style></head><body>
<div class="wrap">
  <div class="col">
    <div class="bar" style="width:4px"></div><div class="bar" style="width:8px"></div>
    <div class="bar" style="width:12px"></div><div class="bar" style="width:16px"></div>
    <div class="bar" style="width:24px"></div><div class="bar" style="width:32px"></div>
    <div class="lbl">--sp-1…8 · 4px grid</div>
  </div>
  <div class="col">
    <div class="shrow">
      <div><div class="shape" style="width:36px;height:36px;border-radius:var(--radius-xs)"></div><div class="lbl">xs 6</div></div>
      <div><div class="shape" style="width:44px;height:44px;border-radius:var(--radius-sm)"></div><div class="lbl">sm 8</div></div>
      <div><div class="shape" style="width:56px;height:56px;border-radius:var(--radius-md)"></div><div class="lbl">md 12</div></div>
      <div><div class="shape" style="width:72px;height:72px;border-radius:var(--radius-lg)"></div><div class="lbl">lg 16</div></div>
      <div><div class="shape" style="width:96px;height:72px;border-radius:var(--radius-xl) var(--radius-xl) 0 0"></div><div class="lbl">xl 28 · sheets</div></div>
    </div>
  </div>
  <div class="col">
    <div class="shape" style="width:var(--hit-min);height:var(--hit-min);border-radius:var(--radius-full);border-color:var(--accent-workout)"></div>
    <div class="lbl">--hit-min 48px</div>
  </div>
</div>
</body></html>
