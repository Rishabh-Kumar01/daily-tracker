<!-- @dsCard group="Components" viewport="700x420" name="QuantitySheet & ConfirmSheet" subtitle="Bottom sheets: grams stepper + confirm fields" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../ds-loader.js"></script>
</head><body>
<div id="root" style="padding:16px"></div>
<script type="text/plain" id="app-src">
loadDS('../../').then(NS=>{
  const {QuantitySheet,ConfirmSheet}=NS;
  ReactDOM.createRoot(document.getElementById('root')).render(
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,alignItems:'end'}}>
      <QuantitySheet brand="Fage" product="Total 0% Greek Yogurt"
        per100g={{kcal:54,protein:10.3,carbs:3.0,fat:0.2}} initialGrams={150} edited accent="diet" />
      <ConfirmSheet title="Log workout" accent="workout" focusedField={2}
        fields={[{label:'Exercise',value:'Bench press'},{label:'Sets × reps',value:'4 × 8'},{label:'Weight',value:'60',suffix:'kg'}]} />
    </div>
  );
}).catch(e=>{document.getElementById('root').textContent='load failed: '+e.message;});
</script>
<script>window.addEventListener('DOMContentLoaded',()=>{const s=document.getElementById('app-src');(0,eval)(Babel.transform(s.textContent,{presets:[[Babel.availablePresets.react,{runtime:'classic'}]]}).code)});</script>
</body></html>
